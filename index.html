<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09131d" />
    <link rel="icon" href="data:," />
    <title>中国空间站 · 三维交互总览</title>
  </head>
  <body>
    <div id="app">
      <div id="scene-root"></div>
      <div id="ui-layer">
        <header class="topbar" id="topbar">
          <div class="brand-lockup">
            <span class="brand-kicker">TIANGONG / INTERACTIVE OVERVIEW</span>
            <h1>中国空间站</h1>
          </div>
          <div class="status-cluster">
            <div class="orbit-status" id="orbit-status">轨道演示 · 12× · 实际周期 92 分钟</div>
            <div class="mode-indicator" id="mode-indicator">外部总览</div>
          </div>
        </header>

        <section class="overview-copy" id="overview-copy">
          <p class="eyebrow">外部真实感预览</p>
          <h2>从轨道观察中国空间站</h2>
          <p>拖动检查完整组合体，点击舱段名称聚焦对应外部结构。</p>
        </section>

        <aside class="module-panel" id="module-panel" aria-live="polite">
          <div class="panel-kicker">SELECTED MODULE</div>
          <h2 id="panel-title">未选择舱段</h2>
          <p id="panel-description">悬停或点击空间站上的标签。</p>
          <button id="enter-tianhe" type="button" hidden>进入核心舱</button>
        </aside>

        <section class="interior-hud" id="interior-hud" hidden>
          <button class="back-button" id="back-to-overview" type="button">返回总览</button>
          <div class="interior-readout">
            <span id="interior-location">天和核心舱</span>
            <strong id="interior-speed">0.00 m/s</strong>
            <span id="interior-lighting">工作照明</span>
          </div>
          <div class="interaction-target" id="interaction-target"></div>
        </section>

        <div class="crosshair" id="crosshair" hidden aria-hidden="true"></div>

        <div class="loading-screen" id="loading-screen">
          <div class="loading-mark"></div>
          <p>正在建立空间站三维场景</p>
          <span id="loading-detail">准备外部组合体与地球纹理…</span>
        </div>

        <div class="toast" id="toast" role="status"></div>
        <div class="footer-note" id="footer-note">近地轨道随动视角 · 12× 演示速度 · 真实公转周期 92 分钟</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
